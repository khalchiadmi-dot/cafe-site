<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Chiadmi | Bruxelles</title>
    <!-- LIAISON AVEC VOTRE NOUVEAU FICHIER CSS -->
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
      <nav>
        <a href="#" class="logo">☕ Café Chiadmi</a>
        <ul class="nav-links">
          <li><a href="#menu">La Carte</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="admin.html" class="btn-admin-nav">⚙️ Admin</a></li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <h1>Café Chiadmi</h1>
      <p>Votre espace de torréfaction artisanale au cœur de Bruxelles.</p>
    </section>

    <main class="container" id="menu">
      <div class="menu-category">☕ Nos Boissons</div>
      <div class="menu-grid" id="grid-cafes">
         <p class="loading-text">Chargement de la carte...</p>
      </div>
      <div class="menu-category">Gourmandises & Pâtisseries</div>
      <div class="menu-grid" id="grid-patisseries">
         <p class="loading-text">Chargement des douceurs...</p>
      </div>
    </main>

    <section class="container" id="contact">
      <h2>📬 Laisser un message</h2>
      <form id="contact-form">
        <div class="form-group"><label for="name">Nom</label><input type="text" id="name" required /></div>
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" required /></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" rows="4" required></textarea></div>
        <button type="submit" class="btn-submit">Envoyer</button>
      </form>
    </section>

    <footer><p>&copy; 2026 Café Chiadmi — Bruxelles</p></footer>

    <!-- LIAISON AVEC VOTRE NOUVEAU FICHIER JAVASCRIPT -->
    <script src="index.js"></script>
      <script src="script.js"></script>
</body>
</html>
